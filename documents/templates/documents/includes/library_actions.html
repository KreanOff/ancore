<div class="documents-row-actions">
                            <a class="tasks-icon-button documents-icon-button" data-document-modal href="{{ documents_url }}libraries/{{ item.pk }}/edit/" aria-label="Ustawienia dysku {{ item.name }}" title="Ustawienia dysku"><i data-lucide="pencil" aria-hidden="true"></i></a>
                            <form method="post" action="{{ documents_url }}libraries/{{ item.pk }}/delete/">{% csrf_token %}<button type="submit" class="tasks-icon-button documents-icon-button" aria-label="Usuń pusty dysk {{ item.name }}" title="Usuń pusty dysk"><i data-lucide="trash-2" aria-hidden="true"></i></button></form>
                            <a class="tasks-icon-button documents-icon-button documents-library-open" href="{{ documents_url }}?library={{ item.pk }}" aria-label="Otwórz dysk {{ item.name }}" title="Otwórz dysk"><i data-lucide="chevron-right" aria-hidden="true"></i></a>
                        </div>
