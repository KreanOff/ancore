{% load company_avatar %}

{% company_avatar company as avatar %}
<span class="profile-avatar {{ avatar_class }} {{ avatar.color_class }} {% if avatar.photo_url %}has-photo{% endif %}" style="{{ avatar.color_style }}" aria-hidden="true">
    {% if avatar.photo_url %}
    <img src="{{ avatar.photo_url }}" alt="">
    {% else %}
    {% include 'contacts/includes/company_avatar_icon.html' %}
    {% endif %}
</span>
