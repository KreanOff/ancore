<div class="tasks-modal app-modal-panel" id="task-work-log-modal" role="dialog" aria-modal="true" aria-labelledby="task-work-log-title" aria-hidden="true"{% if work_log_modal_open %} data-open-on-load{% endif %}>
    <div class="tasks-modal__dialog">
        <form method="post" action="{{ work_log_url }}" class="tasks-modal__form" data-work-log-form>
            {% csrf_token %}
            <input type="hidden" name="task_pk" value="{{ task.pk }}">
            <input type="hidden" name="action" value="{% if work_log_form.instance.pk %}edit_work_log{% else %}add_work_log{% endif %}">
            <input type="hidden" name="work_log_id" value="{{ work_log_form.instance.pk|default:'' }}">
            <header class="tasks-modal__header">
                <h2 id="task-work-log-title">{% if work_log_form.instance.pk %}Edytuj wpis czasu{% else %}Dodaj czas{% endif %}</h2>
                <button type="button" class="tasks-modal__close" data-close-modal aria-label="Zamknij dziennik pracy" title="Zamknij"><i data-icon="x" aria-hidden="true"></i></button>
            </header>
            <div class="tasks-modal__body tasks-work-log-fields" data-work-log-fields>{% include 'tasks/includes/work_log_fields.html' %}</div>
            <footer class="tasks-modal__footer">
                <button type="submit" class="tasks-modal__submit">Zapisz wpis</button>
                <button type="button" class="btn btn-secondary" data-close-modal>Anuluj</button>
            </footer>
        </form>
    </div>
</div>
