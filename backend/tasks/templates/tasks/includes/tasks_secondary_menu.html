<aside class="tasks-tracker-rail" aria-label="Nawigacja zadań">
    <div class="tasks-rail-header">
        <h1>Zadania</h1>
    </div>

    <div class="tasks-create-menu" data-create-menu>
        <button type="button" class="tasks-new-button tasks-new-button-main" id="open-issue-modal" title="Nowe zadanie" aria-haspopup="dialog" aria-controls="issue-modal" {% if not can_create_issue %}disabled{% endif %}>
            <span aria-hidden="true"><i data-icon="plus"></i></span>
            Nowe zadanie
        </button>
        <button type="button" class="tasks-new-button tasks-new-button-toggle" id="open-create-menu" aria-label="Otwórz menu tworzenia" aria-haspopup="menu" aria-expanded="false">
            <i data-icon="chevron-down" aria-hidden="true"></i>
        </button>
        <div class="tasks-create-menu__panel" id="create-menu-panel" role="menu" aria-labelledby="open-create-menu">
            <button type="button" role="menuitem" data-open-project>Utwórz projekt</button>
            <button type="button" role="menuitem" data-open-issue {% if not can_create_issue %}disabled{% endif %}>Nowe zadanie</button>
            <button type="button" role="menuitem" disabled>Import</button>
        </div>
    </div>

    <nav class="tasks-rail-nav">
        <a href="{% url 'tasks:tasks' %}" class="tasks-rail-link {% if active_view == 'projects' %}is-active{% endif %}">
            <span class="tasks-rail-icon" aria-hidden="true">
                <i data-icon="folders" aria-hidden="true"></i>
            </span>
            Projekty
        </a>
        <a href="{% url 'tasks:tasks' %}?view=all-groups" class="tasks-rail-link {% if active_view == 'all_groups' %}is-active{% endif %}">
            <span class="tasks-rail-icon" aria-hidden="true">
                <i data-icon="folder-open" aria-hidden="true"></i>
            </span>
            Grupy
        </a>
        <a href="{% url 'tasks:tasks' %}?view=all-tasks" class="tasks-rail-link {% if active_view == 'all_tasks' or active_view == 'unassigned_tasks' %}is-active{% endif %}">
            <span class="tasks-rail-icon" aria-hidden="true">
                <i data-icon="list-checks" aria-hidden="true"></i>
            </span>
            Zadania
        </a>
    </nav>

    <div class="tasks-rail-section tasks-project-tree" data-project-tree>
        <div class="tasks-rail-section-title tasks-project-tree-heading">
            <button type="button" class="tasks-project-tree-toggle" aria-label="Zwiń sekcję Twoje projekty" aria-expanded="true" aria-controls="tasks-project-tree-content" data-project-tree-toggle data-project-tree-label="Twoje projekty">
                <i data-icon="chevron-down" aria-hidden="true"></i>
                <span class="tasks-project-tree-label">Twoje projekty</span>
            </button>
            <button type="button" class="tasks-rail-add-button" aria-label="Nowy projekt" title="Nowy projekt" aria-haspopup="dialog" aria-controls="project-modal" data-open-project>
                <span aria-hidden="true"><i data-icon="plus"></i></span>
            </button>
        </div>

        <div class="tasks-project-tree-content" id="tasks-project-tree-content" data-project-tree-content>
        {% for project in projects %}
        <div class="tasks-project-node {% if active_project.id == project.id %}is-current{% endif %}" data-project-node data-project-id="{{ project.id }}">
            <div class="tasks-project-title-row">
                <button type="button" class="tasks-project-title" aria-expanded="true" aria-controls="project-sections-{{ project.id }}" data-project-collapse-toggle>
                    <span>{{ project.name }}</span>
                </button>
                {% if project.can_manage %}
                <div class="tasks-project-actions" data-project-actions>
                    <button type="button" class="tasks-project-more" aria-label="Opcje projektu {{ project.name }}" title="Opcje projektu" aria-haspopup="menu" aria-expanded="false" data-project-menu-toggle>
                        <i data-icon="ellipsis" aria-hidden="true"></i>
                    </button>
                    <div class="tasks-project-menu" role="menu">
                        <button type="button" class="tasks-project-menu-button" role="menuitem" data-open-project-rename data-project-id="{{ project.id }}" data-project-name="{{ project.name|escape }}" data-project-description="{{ project.description|default:''|escape }}" data-project-code="{{ project.code|escape }}" data-project-visibility="{{ project.visibility }}" data-project-source="{{ project.source|default:''|escape }}">
                            <i data-icon="pencil" aria-hidden="true"></i>
                            Edytuj projekt
                        </button>
                        <button type="button" class="tasks-project-menu-button" role="menuitem" aria-haspopup="dialog" aria-controls="project-info-modal" data-open-project-info data-project-id="{{ project.id }}" data-project-name="{{ project.name|escape }}" data-project-description="{{ project.description|default:''|escape }}" data-project-code="{{ project.code|escape }}" data-project-progress-label="{{ project.progress_percent }}%" data-project-tasks-label="{{ project.tasks_count_label }}" data-project-priority-label="{{ project.get_priority_display }}" data-project-status-label="{{ project.get_status_display }}" data-project-stage-label="{{ project.get_stage_display }}" data-project-health-label="{{ project.get_health_display }}" data-project-company-label="{% if project.company %}{{ project.company.name }}{% else %}Brak firmy{% endif %}" data-project-responsible-label="{% if project.responsible_user %}{{ project.responsible_user.get_full_name|default:project.responsible_user.username }}{% else %}Brak osoby{% endif %}" data-project-start-label="{% if project.start_at %}{{ project.start_at|date:'d.m.Y' }}{% else %}Brak startu{% endif %}" data-project-due-label="{% if project.due_at %}{{ project.due_at|date:'d.m.Y' }}{% else %}Brak terminu{% endif %}" data-project-budget-label="{% if project.budget_amount %}{{ project.budget_amount }} {{ project.currency }}{% else %}Brak budżetu{% endif %}" data-project-source-label="{% if project.source %}{{ project.source }}{% else %}Brak źródła{% endif %}" data-project-created-label="{{ project.created_at|date:'d.m.Y' }}" data-project-last-activity-label="{% if project.last_activity_at %}{{ project.last_activity_at|date:'d.m.Y H:i' }}{% else %}Brak aktywności{% endif %}">
                            <i data-icon="info" aria-hidden="true"></i>
                            Informacja o projekcie
                        </button>
                        <button type="button" class="tasks-project-menu-button" role="menuitem" data-open-section-create data-project-id="{{ project.id }}" data-project-name="{{ project.name|escape }}">
                            <i data-icon="plus" aria-hidden="true"></i>
                            Dodaj grupę
                        </button>
                        <form method="post" class="tasks-project-delete-form" data-delete-project-form data-project-name="{{ project.name|escape }}">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="delete_project">
                            <input type="hidden" name="project_id" value="{{ project.id }}">
                            <button type="submit" class="tasks-project-delete-button">
                                {% include 'core/includes/trash_icon.html' %}
                                Usuń projekt
                            </button>
                        </form>
                    </div>
                </div>
                {% endif %}
            </div>
            <div class="tasks-section-links" id="project-sections-{{ project.id }}" data-project-sections>
                {% for section in project.sections.all %}
                <a href="{% url 'tasks:task_group' section.id %}"
                   class="tasks-rail-link {% if active_section.id == section.id %}is-active{% endif %}">
                    {{ section.title }}
                </a>
                {% empty %}
                <div class="tasks-empty-rail-note">Dodaj pierwszą grupę</div>
                {% endfor %}
            </div>
        </div>
        {% empty %}
        <div class="tasks-empty-rail-note">Utwórz projekt, żeby zacząć.</div>
        {% endfor %}
        </div>
    </div>
</aside>
