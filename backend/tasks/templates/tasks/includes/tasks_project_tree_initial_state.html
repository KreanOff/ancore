<script>
    (function () {
        var html = document.documentElement;
        var styles = [];

        try {
            if (localStorage.getItem('collapsedTaskProjectTree') === 'true') {
                html.classList.add('tasks-project-tree-initially-collapsed');
                styles.push(
                    '.tasks-project-tree-initially-collapsed .tasks-project-tree-content{display:none}',
                    '.tasks-project-tree-initially-collapsed .tasks-project-tree-toggle svg{transform:rotate(-90deg)}'
                );
            }

            JSON.parse(localStorage.getItem('collapsedTaskProjects') || '[]').forEach(function (projectId) {
                var safeId = String(projectId).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
                styles.push(
                    '.tasks-project-node:not(.is-current)[data-project-id="' + safeId + '"] .tasks-section-links{display:none}'
                );
            });
        } catch (error) {
            styles = [];
        }

        if (!styles.length) return;

        var style = document.createElement('style');
        style.id = 'tasks-project-tree-initial-state';
        style.textContent = styles.join('\n');
        document.head.appendChild(style);
    })();
</script>
