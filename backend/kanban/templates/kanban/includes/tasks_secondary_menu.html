    <aside class="tasks-tracker-rail" aria-label="Nawigacja Kanban">
        <div class="tasks-rail-header">
            <h1>Kanban</h1>
        </div>

    <div class="tasks-create-menu" data-create-menu>
        <button type="button" class="tasks-new-button tasks-new-button-main" id="open-issue-modal" title="Nowa karta" aria-haspopup="dialog" aria-controls="issue-modal" {% if not can_create_issue %}disabled{% endif %}>
            <span aria-hidden="true"><i data-icon="plus"></i></span>
            Nowa karta
        </button>
        <button type="button" class="tasks-new-button tasks-new-button-toggle" id="open-create-menu" aria-label="Otwórz menu tworzenia" aria-haspopup="menu" aria-expanded="false">
            <i data-icon="chevron-down" aria-hidden="true"></i>
        </button>
        <div class="tasks-create-menu__panel" id="create-menu-panel" role="menu" aria-labelledby="open-create-menu">
            <button type="button" role="menuitem" data-open-project>Utwórz przestrzeń roboczą</button>
            <button type="button" role="menuitem" data-open-issue {% if not can_create_issue %}disabled{% endif %}>Nowa karta</button>
            <button type="button" role="menuitem" disabled>Import</button>
        </div>
    </div>

    <nav class="tasks-rail-nav">
        <div class="tasks-rail-nav-group">
            <a href="{% url 'kanban:tasks' %}?view=projects" class="tasks-rail-link {% if active_view == 'projects' %}is-active{% endif %}">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <i data-icon="folders" aria-hidden="true"></i>
                </span>
                Przestrzenie Kanban
            </a>
            <a href="{% url 'kanban:tasks' %}?view=all-groups" class="tasks-rail-link {% if active_view == 'all_groups' %}is-active{% endif %}">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <i data-icon="kanban" aria-hidden="true"></i>
                </span>
                Tablice
            </a>
            <a href="{% url 'kanban:tasks' %}?view=tags" class="tasks-rail-link {% if active_view == 'tags' %}is-active{% endif %}">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <i data-icon="tag" aria-hidden="true"></i>
                </span>
                Tagi
            </a>
        </div>
    </nav>

    <div class="tasks-rail-section tasks-project-tree" data-project-tree>
        <div class="tasks-rail-section-title tasks-project-tree-heading">
            <button type="button" class="tasks-project-tree-toggle" aria-label="Zwiń sekcję Twoje projekty" aria-expanded="true" aria-controls="tasks-project-tree-content" data-project-tree-toggle data-project-tree-label="Twoje projekty">
                <i data-icon="chevron-down" aria-hidden="true"></i>
                <span class="tasks-project-tree-label">Twoje projekty</span>
            </button>
            <button type="button" class="tasks-rail-add-button" aria-label="Nowy projekt" title="Nowy projekt" aria-haspopup="dialog" aria-controls="project-modal" data-open-project>
                <span aria-hidden="true"><i data-icon="plus"></i></span>
            </button>
        </div>

        <div class="tasks-project-tree-content" id="tasks-project-tree-content" data-project-tree-content>
        {% for project in projects %}
        <div class="tasks-project-node {% if active_project.id == project.id %}is-current{% endif %}" data-project-node data-project-id="{{ project.id }}">
            <div class="tasks-project-title-row">
                <button type="button" class="tasks-project-title" aria-expanded="true" aria-controls="project-sections-{{ project.id }}" data-project-collapse-toggle>
                    <span>{{ project.name }}</span>
                </button>
                <div class="tasks-project-actions" data-project-actions>
                    <button type="button" class="tasks-project-more" aria-label="Opcje przestrzeni roboczej {{ project.name }}" title="Opcje przestrzeni roboczej" aria-haspopup="menu" aria-expanded="false" data-project-menu-toggle>
                        <i data-icon="ellipsis" aria-hidden="true"></i>
                    </button>
                    <div class="tasks-project-menu" role="menu">
                        <button type="button" class="tasks-project-menu-button" role="menuitem" data-open-project-rename data-project-id="{{ project.id }}" data-project-name="{{ project.name|escape }}" data-project-description="{{ project.description|default:''|escape }}" data-project-code="{{ project.code|escape }}">
                            <i data-icon="pencil" aria-hidden="true"></i>
                            Edytuj przestrzeń
                        </button>
                        <button type="button" class="tasks-project-menu-button" role="menuitem" data-open-section-create data-project-id="{{ project.id }}" data-project-name="{{ project.name|escape }}">
                            <i data-icon="plus" aria-hidden="true"></i>
                            Dodaj tablicę
                        </button>
                        <form method="post" class="tasks-project-delete-form" data-delete-project-form data-project-name="{{ project.name|escape }}">
                            {% csrf_token %}
                            <input type="hidden" name="action" value="delete_project">
                            <input type="hidden" name="project_id" value="{{ project.id }}">
                            <button type="submit" class="tasks-project-delete-button">
                                {% include 'core/includes/trash_icon.html' %}
                                Usuń przestrzeń
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="tasks-section-links" id="project-sections-{{ project.id }}" data-project-sections>
                {% for section in project.sections.all %}
                <a href="{% url 'kanban:task_group' section.id %}"
                   class="tasks-rail-link {% if active_section.id == section.id %}is-active{% endif %}">
                    {{ section.title }}
                </a>
                {% empty %}
                <div class="tasks-empty-rail-note">Dodaj pierwszą tablicę</div>
                {% endfor %}
            </div>
        </div>
        {% empty %}
        <div class="tasks-empty-rail-note">Utwórz przestrzeń roboczą, żeby zacząć.</div>
        {% endfor %}
        </div>
    </div>
</aside>
