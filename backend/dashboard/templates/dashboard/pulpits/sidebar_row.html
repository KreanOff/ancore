<div class="sidebar-space-row" data-sidebar-pulpit-row="{{ nav_dashboard.pk }}" data-row-actions>
    <a href="{{ nav_dashboard.url }}" class="nav-link sidebar-subnav-link{% if nav_dashboard.is_current %} active{% endif %}"{% if nav_dashboard.is_current %} aria-current="page"{% endif %} title="{{ nav_dashboard.name }}" data-sidebar-pulpit-link><i class="sidebar-subnav-icon" data-icon="layout-dashboard" aria-hidden="true"></i><span>{{ nav_dashboard.name }}</span></a>
    <button type="button" class="sidebar-header-action sidebar-space-row__toggle" aria-label="Opcje pulpitu: {{ nav_dashboard.name }}" title="Opcje pulpitu" aria-expanded="false" aria-controls="sidebar-pulpit-{{ section_key }}-actions-{{ nav_dashboard.pk }}" popovertarget="sidebar-pulpit-{{ section_key }}-actions-{{ nav_dashboard.pk }}" data-row-actions-toggle><i data-icon="ellipsis" aria-hidden="true"></i></button>
    <div id="sidebar-pulpit-{{ section_key }}-actions-{{ nav_dashboard.pk }}" class="tasks-section-menu sidebar-group-menu sidebar-space-menu" popover="auto" role="group" aria-label="Opcje pulpitu: {{ nav_dashboard.name }}" data-row-actions-panel>
        <form method="post" action="{{ nav_dashboard.favorite_url }}" data-sidebar-pulpit-favorite>
            {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
            <button type="submit" class="tasks-project-menu-button tasks-favorite-toggle" aria-pressed="{{ nav_dashboard.is_favorite|yesno:'true,false' }}"><i data-icon="{% if nav_dashboard.is_favorite %}star-filled{% else %}star{% endif %}" aria-hidden="true"></i><span>{% if nav_dashboard.is_favorite %}Usuń z oznaczonych gwiazdką{% else %}Dodaj do oznaczonych gwiazdką{% endif %}</span></button>
        </form>
        {% if nav_dashboard.can_edit %}<a href="{{ nav_dashboard.gadgets_url }}" class="tasks-project-menu-button"><i data-icon="layout-dashboard" aria-hidden="true"></i><span>Gadżety i układ</span></a><a href="{{ nav_dashboard.access_url }}" class="tasks-project-menu-button"><i data-icon="users" aria-hidden="true"></i><span>Dostępy</span></a><a href="{{ nav_dashboard.edit_url }}" class="tasks-project-menu-button"><i data-icon="settings" aria-hidden="true"></i><span>Ustawienia</span></a>{% endif %}
    </div>
</div>
