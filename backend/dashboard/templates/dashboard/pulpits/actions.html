<div class="documents-item-actions" data-row-actions>
    <button type="button" class="tasks-icon-button{% if not management %} documents-icon-button{% endif %}" data-row-actions-toggle popovertarget="pulpit-actions-{{ item.pk }}" aria-controls="pulpit-actions-{{ item.pk }}" aria-expanded="false" aria-label="Działania: {{ item.name }}"><i data-icon="ellipsis" aria-hidden="true"></i></button>
    <div id="pulpit-actions-{{ item.pk }}" class="tasks-section-menu documents-item-menu" popover="auto" role="group" aria-label="Działania: {{ item.name }}" data-row-actions-panel>
        <div class="documents-menu-actions">
            {% include 'dashboard/pulpits/row_actions.html' %}
        </div>
    </div>
</div>
