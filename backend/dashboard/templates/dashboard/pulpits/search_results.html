{% for dashboard in results %}
<a class="sidebar-workspace-option sidebar-space-picker__result" href="{{ dashboard.url }}" title="{{ dashboard.name }}">
    {% include 'core/emoji.html' with emoji=dashboard.icon_emoji art=dashboard.icon_emoji_art only %}<span>{{ dashboard.name }}</span>
</a>
{% endfor %}
{% if has_more %}<p class="sidebar-workspace-search__empty">Więcej wyników znajdziesz w katalogu pulpitów.</p>{% endif %}
