{% extends 'dashboard/pulpits/base.html' %}
{% block content %}
<div class="tasks-page tasks-list-page work-page pulpits-directory-page" data-pulpits-page data-pulpit-list-url="{{ return_url|default:dashboards_url }}">
    <section class="tasks-workspace">
        <header class="tasks-topbar app-page-header tasks-topbar--directory tasks-topbar--project-directory">
            <div class="tasks-titlebar-left"><h1 class="tasks-topbar-title">Pulpity</h1></div>
            <div class="tasks-titlebar-actions"><a href="{{ create_url }}" class="tasks-tag-topbar-button tasks-tag-topbar-button--row-highlight" data-pulpit-open aria-haspopup="dialog"><i data-icon="plus" aria-hidden="true"></i><span>Utwórz pulpit</span></a></div>
        </header>
        <form class="app-toolbar tasks-filterbar tasks-filterbar--directory work-item-toolbar" method="get" action="{{ dashboards_url }}" data-pulpit-search>
            <div class="tasks-filterbar-left app-toolbar__controls">
                <details class="tasks-project-filter-builder tasks-directory-filter-aggregate">
                    <summary class="tasks-filter-button tasks-project-query-trigger{% if visibility_filter %} is-active{% endif %}" aria-label="Filtrowanie pulpitów"><i data-icon="list-filter" aria-hidden="true"></i><span>Filtruj</span><i data-icon="chevron-down" class="tasks-project-query-trigger__chevron" aria-hidden="true"></i></summary>
                    <div class="tasks-project-query-panel tasks-directory-filter-aggregate__panel" role="group" aria-label="Filtry pulpitów">
                        <header class="tasks-project-query-panel__header"><strong>Filtry pulpitów</strong></header>
                        <div class="tasks-project-filter-detail__body">
                            <label for="pulpit-visibility-filter">Widoczność pulpitu</label>
                            <select id="pulpit-visibility-filter" name="visibility" class="form-select" aria-label="Widoczność pulpitu"><option value="">Każda widoczność</option>{% for value, label in visibility_choices %}<option value="{{ value }}"{% if visibility_filter == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select>
                            <button class="tasks-filter-button" type="submit"><i data-icon="list-filter" aria-hidden="true"></i><span>Filtruj</span></button>
                        </div>
                    </div>
                </details>
            </div>
            <div class="tasks-filterbar-right app-toolbar__search">
                <label class="tasks-search-field tasks-project-search"><i data-icon="search" aria-hidden="true"></i><input type="search" name="q" value="{{ query }}" placeholder="Szukaj pulpitu" aria-label="Szukaj pulpitu"></label>
            </div>
        </form>
        <div class="work-content work-content--directory">
            {% include 'dashboard/pulpits/directory.html' %}
        </div>
    </section>
</div>
{% endblock %}
