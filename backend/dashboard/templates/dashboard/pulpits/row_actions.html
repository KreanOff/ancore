{% if management or directory %}<a href="{{ item.url }}" class="tasks-project-menu-button"><i data-icon="layout-dashboard" aria-hidden="true"></i><span>Otwórz pulpit</span></a>{% endif %}
{% if directory %}
<form method="post" action="{{ item.favorite_url }}" data-pulpit-action>
    {% csrf_token %}<input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="tasks-project-menu-button tasks-favorite-toggle" aria-pressed="{{ item.is_favorite|yesno:'true,false' }}"><i data-icon="{% if item.is_favorite %}star-filled{% else %}star{% endif %}" aria-hidden="true"></i><span>{% if item.is_favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}</span></button>
</form>
{% endif %}
{% if item.can_edit %}
<a href="{{ item.gadgets_url }}" class="tasks-project-menu-button"><i data-icon="layout-dashboard" aria-hidden="true"></i><span>Gadżety i układ</span></a>
<a href="{{ item.access_url }}" class="tasks-project-menu-button"><i data-icon="users" aria-hidden="true"></i><span>Dostępy</span></a>
<a href="{{ item.edit_url }}" class="tasks-project-menu-button"><i data-icon="settings" aria-hidden="true"></i><span>Ustawienia</span></a>
{% if not item.is_default %}<form method="post" action="{{ item.delete_url }}" data-pulpit-action data-confirm-title="Usuń pulpit" data-confirm-name="{{ item.name }}">{% csrf_token %}<button class="tasks-project-menu-button" type="submit">{% include 'core/includes/trash_icon.html' %}<span>Usuń pulpit</span></button></form>{% endif %}
{% endif %}
