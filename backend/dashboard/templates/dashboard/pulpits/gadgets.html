{% extends 'dashboard/pulpits/base.html' %}
{% block title %}Gadżety i układ — {{ dashboard.name }} | ancore{% endblock %}
{% block content %}
<div class="dashboard-page dashboard-overview pulpits-page pulpit-editor-page" data-pulpits-page data-pulpit-list-url="{{ editor_url }}" data-pulpit-arrange-url="{{ arrange_url }}" data-pulpit-revision="{{ dashboard.revision }}" data-pulpit-quick-add-url="{{ quick_add_url }}" data-pulpit-count="{{ gadget_count }}" data-pulpit-max="{{ max_gadgets }}">
    <header class="tasks-topbar tasks-topbar--directory tasks-topbar--project-directory app-page-header pulpit-topbar">
        <div class="tasks-titlebar-left"><h1 class="tasks-topbar-title" title="{{ dashboard.name }}">{{ dashboard.name }}</h1></div>
        <div class="tasks-titlebar-actions">
            <a href="{{ add_gadget_url }}" class="tasks-tag-topbar-button tasks-tag-topbar-button--secondary" data-pulpit-open><i data-icon="plus" aria-hidden="true"></i><span>Dodaj gadżet</span></a>
            <a href="{{ dashboard.url }}" class="tasks-tag-topbar-button tasks-tag-topbar-button--secondary" aria-label="Anuluj — wróć do pulpitu">Anuluj</a>
        </div>
    </header>
    <noscript><p class="work-caption work-summary-edit-hint">Włącz JavaScript, aby przesuwać kafelki i zmieniać ich rozmiar.</p></noscript>
    <span class="u-sr-only" data-pulpit-status role="status" aria-live="polite"></span>
    <div class="pulpit-editor-body">
        {% include 'dashboard/pulpits/canvas.html' %}
        {% include 'dashboard/pulpits/catalog.html' %}
    </div>
</div>
{% endblock %}
