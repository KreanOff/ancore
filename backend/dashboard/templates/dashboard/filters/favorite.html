<form action="{{ item.favorite_url }}" method="post" data-filter-action>{% csrf_token %}<input type="hidden" name="return_to" value="{{ list_url|default:request.get_full_path }}"><button type="submit" class="tasks-favorite-toggle {% if menu %}tasks-project-menu-button{% else %}tasks-icon-button{% if item.favorite %} is-active{% endif %}{% endif %}" aria-pressed="{{ item.favorite|yesno:'true,false' }}" aria-label="{% if item.favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}: {{ item.name }}" title="{% if item.favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}"><i data-icon="{% if item.favorite %}star-filled{% else %}star{% endif %}" aria-hidden="true"></i>{% if menu %}<span>{% if item.favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}</span>{% endif %}</button></form>
