<form action="{{ item.favorite_url }}" method="post" data-filter-action>{% csrf_token %}<input type="hidden" name="return_to" value="{% if management %}{{ list_url }}{% else %}{{ request.get_full_path }}{% endif %}"><button type="submit" class="{% if menu %}tasks-project-menu-button{% else %}tasks-icon-button{% if item.favorite %} is-active{% endif %}{% endif %}" aria-pressed="{{ item.favorite|yesno:'true,false' }}" aria-label="{% if item.favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}: {{ item.name }}" title="{% if item.favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}"><i data-icon="star" aria-hidden="true"></i>{% if menu %}<span>{% if item.favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}</span>{% endif %}</button></form>
