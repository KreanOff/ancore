<div class="sidebar-space-row" data-sidebar-filter-row="{{ nav_filter.pk }}" data-row-actions>
    <a href="{{ nav_filter.url }}" class="nav-link sidebar-subnav-link{% if nav_filter.current %} active{% endif %}"{% if nav_filter.current %} aria-current="page"{% endif %} title="{{ nav_filter.name }}" data-sidebar-filter-link><i class="sidebar-subnav-icon" data-icon="filter" aria-hidden="true"></i><span>{{ nav_filter.name }}</span></a>
    <button type="button" class="sidebar-header-action sidebar-space-row__toggle" aria-label="Opcje filtra: {{ nav_filter.name }}" title="Opcje filtra" aria-expanded="false" aria-controls="sidebar-filter-actions-{{ nav_filter.pk }}" popovertarget="sidebar-filter-actions-{{ nav_filter.pk }}" data-row-actions-toggle><i data-icon="ellipsis" aria-hidden="true"></i></button>
    <div id="sidebar-filter-actions-{{ nav_filter.pk }}" class="tasks-section-menu sidebar-group-menu sidebar-space-menu" popover="auto" role="group" aria-label="Opcje filtra: {{ nav_filter.name }}" data-row-actions-panel>
        <form method="post" action="{{ nav_filter.favorite_url }}" data-sidebar-filter-favorite>
            {% csrf_token %}<input type="hidden" name="return_to" value="{{ request.get_full_path }}">
            <button type="submit" class="tasks-project-menu-button"><i data-icon="star" aria-hidden="true"></i><span>{% if nav_filter.favorite %}Usuń z oznaczonych gwiazdką{% else %}Dodaj do oznaczonych gwiazdką{% endif %}</span></button>
        </form>
        {% if nav_filter.editable %}<a href="{{ nav_filter.edit_url }}" class="tasks-project-menu-button" data-sidebar-filter-action><i data-icon="settings" aria-hidden="true"></i><span>Ustawienia filtra i dostępy</span></a>{% endif %}
    </div>
</div>
