<div class="tasks-modal app-modal-panel tasks-form-modal" role="dialog" aria-modal="true" aria-labelledby="filter-modal-title" aria-hidden="true" data-filter-modal>
    <div class="tasks-modal__dialog"><form method="post" action="{{ modal.action }}" class="tasks-modal__form" data-filter-form>{% csrf_token %}
        {% if list_url %}<input type="hidden" name="return_to" value="{{ list_url }}">{% endif %}
        <header class="tasks-modal__header"><h2 id="filter-modal-title">{{ modal.title }}</h2><button type="button" class="tasks-modal__close" aria-label="Zamknij" data-close-modal></button></header>
        <div class="tasks-modal__body documents-form task-filter-form app-form-layout">
            <div class="tasks-modal__errors app-form-wide" role="alert" data-filter-error hidden></div>
            {% if modal.form.non_field_errors %}<div class="tasks-modal__errors app-form-wide" role="alert">{{ modal.form.non_field_errors }}</div>{% endif %}
            {% include 'core/includes/modal_form_fields.html' with form=modal.form field_scope='filter' only %}
        </div>
        <footer class="tasks-modal__footer"><button type="button" class="btn btn-secondary" data-close-modal>Anuluj</button><button type="submit" class="tasks-modal__submit">Zapisz</button></footer>
    </form></div>
</div>
