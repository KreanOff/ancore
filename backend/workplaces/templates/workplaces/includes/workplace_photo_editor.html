<div class="profile-photo-control profile-photo-control--modal workplace-photo-control"
     data-profile-photo-editor
     {% if workplace_logo.photo_url %}data-profile-photo-url="{{ workplace_logo.photo_url }}"{% endif %}>
    <button type="button"
            class="profile-photo-preview-button"
            aria-label="Wybierz awatar Workspace"
            title="Wybierz awatar Workspace"
            data-workplace-avatar-open aria-haspopup="dialog" aria-expanded="false" aria-controls="{{ form_id }}-avatar-modal">
        <span class="profile-avatar profile-page-avatar profile-avatar--workplace {{ workplace_logo.color_class }}{% if not workplace_logo.photo_url %} space-avatar-art {{ workplace_logo.preset_class }}{% endif %} {% if workplace_logo.photo_url %}has-photo{% endif %}"
              {% if workplace_logo.color_style %}style="{{ workplace_logo.color_style }}"{% endif %}
              aria-hidden="true"
              data-profile-photo-preview>
            {% if workplace_logo.photo_url %}
            <img src="{{ workplace_logo.photo_url }}" alt="">
            {% endif %}
        </span>
    </button>
    <template data-profile-photo-fallback></template>
    <button type="button" class="profile-photo-button" title="Wybierz awatar Workspace" data-workplace-avatar-open aria-haspopup="dialog" aria-expanded="false" aria-controls="{{ form_id }}-avatar-modal">{{ photo_button_label }}</button>

    {% if form.workplace_photo.errors or form.workplace_photo_crop.errors or form.avatar.errors %}<span class="workplace-photo-control__error" role="alert">Popraw wybór awatara.</span>{% endif %}
    {% include 'workplaces/includes/avatar_picker.html' with form=form form_id=form_id only %}
</div>
