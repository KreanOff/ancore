<div id="{{ picker_id }}" class="sidebar-workspace-menu sidebar-space-picker" popover="auto" role="dialog" aria-labelledby="{{ picker_id }}-title" data-sidebar-picker="{{ picker_group }}" data-search-url="{{ search_url }}" data-directory-url="{{ directory_url }}" data-empty-message="{{ empty_message }}" data-error-message="{{ error_message }}">
    <header class="sidebar-collapsed-flyout__header">
        <strong id="{{ picker_id }}-title">{{ picker_title }}</strong>
        <button type="button" class="sidebar-collapsed-flyout__close" aria-label="{{ close_label }}" title="Zamknij" data-sidebar-picker-close><i data-icon="x" aria-hidden="true"></i></button>
    </header>
    <form class="sidebar-workspace-search" action="{{ directory_url }}" method="get" data-sidebar-picker-form>
        {% if picker_group == 'pulpits' or picker_group == 'filters' %}<input type="hidden" name="tab" value="all">{% endif %}
        <label><i data-icon="search" aria-hidden="true"></i><input type="search" name="q" placeholder="{{ search_label }}" aria-label="{{ search_label }}" maxlength="120" autocomplete="off" aria-controls="{{ picker_id }}-results" data-sidebar-picker-input></label>
    </form>
    <p class="sidebar-workspace-search__empty" role="status" aria-live="polite" data-sidebar-picker-status hidden></p>
    <nav id="{{ picker_id }}-results" class="sidebar-workspace-menu__list" aria-label="{{ results_label }}" data-sidebar-picker-results hidden></nav>
    <a class="sidebar-workspace-manage" href="{{ directory_url }}" data-sidebar-picker-directory><i data-icon="align-left" aria-hidden="true"></i><span>{{ directory_label }}</span></a>
</div>
