<span class="tasks-priority-icon" aria-hidden="true">
    {% if priority == 'urgent' %}
    <i data-icon="circle-alert" data-icon-fallback="triangle-alert" aria-hidden="true"></i>
    {% elif priority == 'high' %}
    <i data-icon="arrow-up" data-icon-fallback="chevron-up" aria-hidden="true"></i>
    {% elif priority == 'medium' %}
    <i data-icon="equal" data-icon-fallback="minus" aria-hidden="true"></i>
    {% elif priority == 'low' %}
    <i data-icon="arrow-down" data-icon-fallback="chevron-down" aria-hidden="true"></i>
    {% else %}
    <i data-icon="circle" aria-hidden="true"></i>
    {% endif %}
</span>
