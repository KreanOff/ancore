{% load static %}<!doctype html>
<html lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ status }} — {{ title }} | Ancore</title>
    <link rel="icon" href="{% static 'img/logo.png' %}" type="image/png">
    <link rel="stylesheet" href="{% static 'css/components/http-error.css' %}">
</head>
<body class="http-error">
    <main class="http-error__main" aria-labelledby="http-error-title">
        <a class="http-error__brand" href="{% url 'home' %}" aria-label="Ancore — strona główna">
            <img src="{% static 'img/logo.png' %}" alt="" width="24" height="24">ANCORE
        </a>
        <p class="http-error__code">{{ status }}</p>
        <h1 id="http-error-title">{{ title }}</h1>
        <p class="http-error__description">{{ description }}</p>
        <a class="btn btn-primary http-error__action" href="{% url 'home' %}">Wróć do strony głównej</a>
    </main>
</body>
</html>
