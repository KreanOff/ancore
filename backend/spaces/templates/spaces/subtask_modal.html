<div class="tasks-modal app-modal-panel tasks-issue-modal {% if subtask_modal_open %}is-open{% endif %}" id="space-subtask-modal" role="dialog" aria-modal="true" aria-labelledby="space-subtask-modal-title" aria-hidden="{% if subtask_modal_open %}false{% else %}true{% endif %}">
    <div class="tasks-modal__dialog tasks-issue-modal__dialog">
        <form method="post" class="tasks-modal__form tasks-issue-modal__form" id="space-subtask-form">
            {% csrf_token %}
            <input type="hidden" name="task_pk" value="{{ task.pk }}">
            <input type="hidden" name="action" value="create_subtask_modal">
            <header class="tasks-modal__header tasks-issue-modal__header">
                <div class="tasks-issue-modal__crumbs">
                    <button type="button" class="tasks-issue-close" data-close-modal aria-label="Zamknij" title="Zamknij">
                        <i data-icon="arrow-left" aria-hidden="true"></i>
                    </button>
                    <span class="tasks-issue-divider" aria-hidden="true"></span>
                    <strong id="space-subtask-modal-title">Nowe podzadanie</strong>
                </div>
            </header>

            <div class="tasks-modal__body tasks-issue-modal__body app-form-layout">
                {% if subtask_form.non_field_errors %}<div class="tasks-modal__errors app-form-wide" role="alert">{{ subtask_form.non_field_errors }}</div>{% endif %}
                {% include 'core/includes/modal_form_fields.html' with form=subtask_form only %}
            </div>

            <footer class="tasks-modal__footer tasks-issue-modal__footer">
                <button type="button" class="btn btn-secondary" data-close-modal>Anuluj</button>
                <button type="submit" class="tasks-modal__submit" id="issue-create-submit">Utwórz podzadanie</button>
            </footer>
        </form>
    </div>
</div>
