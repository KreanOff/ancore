<a class="tasks-project-menu-button" href="{{ item.url }}"><i data-icon="search" aria-hidden="true"></i>Otwórz filtr</a>
{% if item.editable %}<a class="tasks-project-menu-button" href="{{ item.edit_url }}" data-filter-open><i data-icon="pencil" aria-hidden="true"></i>Edytuj filtr i dostępy</a>{% endif %}
<a class="tasks-project-menu-button" href="{{ search_url }}?jql={{ item.query|urlencode }}&mode=advanced"><i data-icon="copy" aria-hidden="true"></i>Użyj w nowym wyszukiwaniu</a>
{% if item.editable %}<form method="post" action="{{ item.delete_url }}" data-filter-action data-confirm-name="{{ item.name }}">{% csrf_token %}<button class="tasks-project-menu-button tasks-project-menu-button--danger" type="submit"><i data-icon="trash-2" aria-hidden="true"></i>Usuń filtr</button></form>{% endif %}
