<form action="{{ item.favorite_url }}" method="post" data-filter-action>{% csrf_token %}<input type="hidden" name="return_to" value="{{ request.get_full_path }}"><button type="submit" class="tasks-icon-button{% if item.favorite %} is-active{% endif %}" aria-pressed="{{ item.favorite|yesno:'true,false' }}" aria-label="{% if item.favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}: {{ item.name }}" title="{% if item.favorite %}Usuń z ulubionych{% else %}Dodaj do ulubionych{% endif %}"><i data-icon="star" aria-hidden="true"></i></button></form>
