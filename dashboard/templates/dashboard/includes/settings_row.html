<a href="{{ href }}" class="settings-row settings-row--link" data-settings-row>
    <span class="settings-row-icon" aria-hidden="true"><i data-icon="{{ icon }}"></i></span>
    <span class="settings-row-copy"><strong>{{ title }}</strong><span>{{ description }}</span></span>
    <i class="settings-row-arrow" data-icon="chevron-right" aria-hidden="true"></i>
</a>
