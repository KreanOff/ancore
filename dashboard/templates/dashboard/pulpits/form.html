<div class="tasks-modal app-modal-panel app-modal-panel--compact tasks-form-modal" role="dialog" aria-modal="true" aria-labelledby="pulpit-modal-title" aria-hidden="true" data-pulpit-modal>
    <div class="tasks-modal__dialog">
        <form method="post" action="{{ modal.action }}" class="tasks-modal__form" data-pulpit-form>
            {% csrf_token %}
            <header class="tasks-modal__header"><h2 id="pulpit-modal-title">{{ modal.title }}</h2><button type="button" class="tasks-modal__close" aria-label="Zamknij" data-close-modal></button></header>
            <div class="tasks-modal__body documents-form pulpit-form">
                <div class="tasks-modal__errors" role="alert" data-pulpit-error hidden></div>
                {% include 'dashboard/pulpits/fields.html' with form=modal.form only %}
            </div>
            <footer class="tasks-modal__footer"><button type="button" class="btn btn-secondary" data-close-modal>Anuluj</button><button type="submit" class="tasks-modal__submit">Zapisz</button></footer>
        </form>
    </div>
</div>
