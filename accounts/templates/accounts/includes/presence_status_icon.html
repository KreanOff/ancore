{% if status == 'active' %}
<i class="profile-presence-icon" data-lucide="circle-check" aria-hidden="true"></i>
{% elif status == 'inactive' %}
<i class="profile-presence-icon" data-lucide="circle-x" aria-hidden="true"></i>
{% elif status == 'out_of_office' %}
<i class="profile-presence-icon" data-lucide="circle-arrow-down" aria-hidden="true"></i>
{% elif status == 'busy' %}
<i class="profile-presence-icon" data-lucide="circle-zap" aria-hidden="true"></i>
{% elif status == 'do_not_disturb' %}
<i class="profile-presence-icon" data-lucide="circle-alert" aria-hidden="true"></i>
{% else %}
<i class="profile-presence-icon" data-lucide="circle" aria-hidden="true"></i>
{% endif %}
