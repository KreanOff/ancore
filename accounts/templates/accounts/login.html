{% extends 'accounts/auth_base.html' %}

{% block title %}ancore{% endblock %}
{% block auth_subtitle %}Zaloguj się na swoje konto{% endblock %}

{% block auth_content %}
<form method="post">
    {% csrf_token %}

    {% if form.errors %}
    <div class="alert alert-error">
        Nieprawidłowy email lub hasło.
    </div>
    {% endif %}

    <div class="form-group">
        <label class="form-label" for="email">Adres Email</label>
        <input type="email" name="username" id="email" class="form-input" required autofocus>
    </div>
    <div class="form-group">
        <label class="form-label" for="password">Hasło</label>
        <input type="password" name="password" id="password" class="form-input" required>
    </div>
    <button type="submit" class="btn btn-primary btn-block">Zaloguj się</button>
</form>

<div class="auth-footer">
    Nie masz konta? <a href="{% url 'register' %}">Zarejestruj się</a>
</div>
{% endblock %}
