<div class="tasks-directory-members-menu" data-directory-members-menu>
    <button type="button" class="tasks-directory-members" title="{{ item.directory_member_title }}" aria-label="Pokaż członków" aria-haspopup="dialog" aria-expanded="false" aria-controls="tasks-directory-members-{{ item_kind }}-{{ item.id }}" data-directory-members-toggle>
        <span class="tasks-directory-avatar-stack">
            {% for member in item.directory_visible_members %}
            {% include 'accounts/includes/user_avatar.html' with avatar=member.avatar avatar_class='tasks-directory-avatar' only %}
            {% endfor %}
        </span>
        <span class="tasks-directory-member-label">{{ item.directory_member_label }}</span>
    </button>
    <div class="tasks-directory-members-popover" id="tasks-directory-members-{{ item_kind }}-{{ item.id }}" role="dialog" aria-label="Członkowie" data-directory-members-popover>
        <div class="tasks-directory-members-toolbar">
            <label class="tasks-directory-member-search">
                <i data-lucide="search" aria-hidden="true"></i>
                <input type="text" placeholder="Szukaj" aria-label="Szukaj członków" autocomplete="off" data-directory-members-search>
            </label>
            <button type="button" class="tasks-directory-member-submit" data-directory-share-open {% if item_kind == 'project' %}data-share-action="share_project" data-share-project-id="{{ item.id }}" data-share-object-type="Projekt" data-share-object-name="{{ item.name|escape }}"{% else %}data-share-action="share_section" data-share-section-id="{{ item.id }}" data-share-object-type="Grupa" data-share-object-name="{{ item.title|escape }}"{% endif %}>
                <i data-lucide="plus" aria-hidden="true"></i>
                <span>Dodaj</span>
            </button>
        </div>
        <div class="tasks-directory-members-list">
            {% for member in item.directory_members %}
            <div class="tasks-directory-member-row" data-directory-member-row data-directory-member-search="{{ member.label|escape }} {{ member.role|escape }}">
                {% include 'accounts/includes/user_avatar.html' with avatar=member.avatar avatar_class='tasks-directory-avatar' only %}
                <span class="tasks-directory-member-row-text">
                    <strong>{{ member.label }}</strong>
                    <small>{{ member.role }}</small>
                </span>
            </div>
            {% empty %}
            <div class="tasks-directory-member-empty">Brak członków.</div>
            {% endfor %}
            <div class="tasks-directory-member-empty" data-directory-members-no-results hidden>Brak wyników.</div>
        </div>
    </div>
</div>
