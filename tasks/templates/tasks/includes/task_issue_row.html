<article class="task-row tasks-issue-row {% if task.status == 'closed' %}completed{% endif %}"
         draggable="true"
         data-task-id="{{ task.task_id }}"
         data-status="{{ task.status }}"
         data-priority="{{ task.priority }}"
         data-view-url="{% url 'tasks:view-task' task.task_id %}">
    <input type="checkbox" class="task-checkbox" data-task-id="{{ task.task_id }}" aria-label="Zaznacz {{ task.title }}">
    <span class="tasks-row-priority priority-{{ task.priority }}"
          title="Priorytet: {{ task.get_priority_display }}"
          aria-label="Priorytet: {{ task.get_priority_display }}">
        <span class="tasks-priority-icon" aria-hidden="true">
            {% if task.priority == 'urgent' %}
                <span class="tasks-priority-urgent-mark">!</span>
            {% elif task.priority == 'none' %}
                <span class="tasks-priority-no-mark"></span>
            {% else %}
                <span class="tasks-priority-bars">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            {% endif %}
        </span>
    </span>
    <span class="tasks-row-id">{{ project_code }}-{{ task.task_id }}</span>
    <span class="status-indicator status-{{ task.status }}" aria-label="{{ task.get_status_display }}"></span>
    <span class="tasks-row-title">{{ task.title }}</span>
    <span class="tasks-row-comments" title="Załączniki i komentarze">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
        </svg>
        {{ task.attachments.count }}
    </span>
    <span class="tasks-row-time">0 godz.</span>
    <span class="tasks-row-date">{{ task.created_at|date:"d M" }}</span>
</article>
