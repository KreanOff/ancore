<div class="tasks-project-pagination{% if pagination_class %} {{ pagination_class }}{% else %} tasks-project-pagination--toolbar{% endif %}" data-project-pagination data-server-pagination="true" data-project-current-page="{{ window.page }}" data-project-total-pages="{{ window.total_pages }}">
    <span class="u-sr-only">Na stronie</span>
    {% if include_page_items %}
    <span class="u-sr-only">
        {% for page_item in window.page_items %}
            {% if page_item.is_ellipsis %}
            <span aria-hidden="true">…</span>
            {% else %}
            <button type="button" data-project-page="{{ page_item.page }}" data-project-page-url="{{ page_item.url }}"{% if page_item.is_current %} aria-current="page"{% endif %}>{{ page_item.page }}</button>
            {% endif %}
        {% endfor %}
    </span>
    {% else %}
    <button type="button" class="u-sr-only" aria-current="page">{{ window.page }}</button>
    {% endif %}
    <nav class="tasks-project-pagination__pages tasks-project-pagination__pages--toolbar" aria-label="{{ pages_label }}">
        <button type="button" class="tasks-project-pagination__button" aria-label="{{ previous_label }}" data-project-page-prev data-project-page-url="{{ window.previous_url }}" {% if not window.has_previous %}disabled{% endif %}>
            <i data-lucide="chevron-left" aria-hidden="true"></i>
        </button>
        <span class="tasks-project-pagination__summary tasks-project-pagination__summary--compact" aria-label="{{ window.summary }}" aria-live="polite" data-project-pagination-summary>{{ window.compact_summary }}</span>
        <button type="button" class="tasks-project-pagination__button" aria-label="{{ next_label }}" data-project-page-next data-project-page-url="{{ window.next_url }}" {% if not window.has_next %}disabled{% endif %}>
            <i data-lucide="chevron-right" aria-hidden="true"></i>
        </button>
    </nav>
    <div class="tasks-filter-dropdown tasks-project-pagination__size-control tasks-project-pagination__size-control--compact tasks-project-pagination__size-control--toolbar" data-project-page-size-dropdown>
        <select aria-label="{{ page_size_label }}" data-project-page-size hidden>
            {% for page_size in window.page_size_options %}
            <option value="{{ page_size }}" {% if window.page_size == page_size %}selected{% endif %}>{{ page_size }}</option>
            {% endfor %}
        </select>
        <button type="button" class="tasks-project-pagination__size-button tasks-project-pagination__size-button--compact tasks-project-pagination__size-button--toolbar" aria-label="{{ page_size_label }}" aria-haspopup="menu" aria-expanded="false" data-project-page-size-toggle>
            <i data-lucide="rows-3" aria-hidden="true"></i>
            <span class="tasks-project-pagination__size-value"><strong data-project-page-size-label>{{ window.page_size }}</strong><span>/ stronę</span></span>
            <i data-lucide="chevron-down" aria-hidden="true"></i>
        </button>
        <div class="tasks-filter-menu tasks-project-pagination__size-menu" role="menu" aria-label="{{ page_size_label }}">
            {% for page_size in window.page_size_options %}
            <button type="button" role="menuitemradio" aria-checked="{% if window.page_size == page_size %}true{% else %}false{% endif %}" {% if window.page_size == page_size %}class="is-active"{% endif %} data-project-page-size-value="{{ page_size }}">{{ page_size }}</button>
            {% endfor %}
        </div>
    </div>
</div>
