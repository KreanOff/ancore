<header class="tasks-issue-group-header{% if category %} tasks-status-block-header tasks-status-block-header--{{ category }}{% endif %}">
    <button type="button" class="tasks-group-caret" aria-label="Zwiń {% if category %}status {{ label }}{% else %}{{ label|lower }}{% endif %}" data-group-label="{% if category %}status {{ label }}{% else %}{{ label|lower }}{% endif %}" aria-expanded="true"><i data-icon="chevron-down" aria-hidden="true"></i></button>
    {% if category %}<span class="status-indicator status-{{ category }}">{{ label }}</span>{% else %}<span class="tasks-issue-group-label"><i data-icon="{{ icon }}" aria-hidden="true"></i>{{ label }}</span>{% endif %}
    <span class="tasks-rail-count">{{ count }}</span>
</header>
