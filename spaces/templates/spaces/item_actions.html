<div class="documents-item-actions work-item-actions" data-row-actions>
    <button type="button" class="tasks-icon-button documents-icon-button" data-row-actions-toggle popovertarget="work-item-{{ item.pk }}-actions" aria-controls="work-item-{{ item.pk }}-actions" aria-expanded="false" aria-label="Działania {{ item.key }}" title="Działania {{ item.key }}"><i data-icon="menu" aria-hidden="true"></i></button>
    <div id="work-item-{{ item.pk }}-actions" class="tasks-section-menu documents-item-menu" popover="auto" role="group" aria-label="Działania {{ item.key }}" data-row-actions-panel>
        <div class="documents-menu-actions">
            <a class="tasks-project-menu-button" href="{{ item.url }}"><i data-icon="external-link" aria-hidden="true"></i><span>Otwórz zadanie</span></a>
            <a class="tasks-project-menu-button" href="{{ item.edit_url }}" data-work-open aria-haspopup="dialog"><i data-icon="pencil" aria-hidden="true"></i><span>Edytuj {{ item.key }}</span></a>
            {% for status in item.transitions %}
            <form method="post" action="{{ item.action_url }}" data-work-action>{% csrf_token %}<input type="hidden" name="action" value="status"><input type="hidden" name="status" value="{{ status.key }}"><input type="hidden" name="return_view" value="{{ view|default:'list' }}"><button class="tasks-project-menu-button" type="submit"><span class="status-indicator status-{{ status.category }}" aria-hidden="true"></span><span>Zmień na: {{ status.label }}</span></button></form>
            {% endfor %}
            {% if view == 'backlog' %}
            <form method="post" action="{{ item.action_url }}">{% csrf_token %}<input type="hidden" name="action" value="up"><input type="hidden" name="return_view" value="backlog"><button class="tasks-project-menu-button" type="submit"><i data-icon="arrow-up" aria-hidden="true"></i><span>Przesuń wyżej</span></button></form>
            <form method="post" action="{{ item.action_url }}">{% csrf_token %}<input type="hidden" name="action" value="down"><input type="hidden" name="return_view" value="backlog"><button class="tasks-project-menu-button" type="submit"><i data-icon="arrow-down" aria-hidden="true"></i><span>Przesuń niżej</span></button></form>
            {% endif %}
            {% if space.template == 'kanban' %}<form method="post" action="{{ item.action_url }}">{% csrf_token %}<input type="hidden" name="action" value="{% if item.in_backlog %}board{% else %}backlog{% endif %}"><input type="hidden" name="return_view" value="{{ view }}"><button class="tasks-project-menu-button" type="submit"><i data-icon="arrow-right" aria-hidden="true"></i><span>{% if item.in_backlog %}Przenieś na tablicę{% else %}Przenieś do backlogu{% endif %}</span></button></form>{% endif %}
        </div>
    </div>
</div>
