{% if page.paginator.num_pages > 1 %}<nav class="work-pagination" aria-label="Strony wyników">{% if page.has_previous %}<a class="btn btn-secondary" href="{% querystring page=page.previous_page_number %}">Poprzednia</a>{% endif %}<span>Strona {{ page.number }} z {{ page.paginator.num_pages }} · {{ page.paginator.count }} wyników</span>{% if page.has_next %}<a class="btn btn-secondary" href="{% querystring page=page.next_page_number %}">Następna</a>{% endif %}</nav>{% endif %}
