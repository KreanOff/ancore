<div class="tasks-modal app-modal-panel tasks-form-modal work-modal" role="dialog" aria-modal="true" aria-labelledby="work-modal-title" aria-hidden="true" data-work-modal>
<div class="tasks-modal__dialog"><form method="post" action="{{ modal.action }}" enctype="multipart/form-data" class="tasks-modal__form" data-work-form>
{% csrf_token %}<header class="tasks-modal__header"><h2 id="work-modal-title">{{ modal.title }}</h2><button type="button" class="tasks-modal__close" aria-label="Zamknij" data-close-modal></button></header>
<div class="tasks-modal__body documents-form resources-form"><div class="tasks-modal__errors resources-form-wide" role="alert" data-work-error hidden></div>{% if modal.form.non_field_errors %}<div class="tasks-modal__errors resources-form-wide" role="alert">{{ modal.form.non_field_errors }}</div>{% endif %}
{% for field in modal.form %}<div class="documents-field tasks-form-field{% if field.name == 'name' or field.name == 'description' or field.name == 'title' or field.name == 'spaces' %} resources-form-wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span aria-hidden="true"> *</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small id="{{ field.auto_id }}_helptext">{{ field.help_text }}</small>{% endif %}{% if field.errors %}<div class="tasks-modal__errors" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
</div><footer class="tasks-modal__footer"><button type="button" class="btn btn-secondary" data-close-modal>Anuluj</button><button type="submit" class="tasks-modal__submit">Zapisz</button></footer></form></div></div>
