<div class="calendar-legend-list" aria-label="Filtruj wydarzenia według koloru">
    <button type="button" data-color-filter="red" aria-pressed="true"><span class="calendar-color-dot calendar-color-dot--red"></span>Czerwony</button>
    <button type="button" data-color-filter="blue" aria-pressed="true"><span class="calendar-color-dot calendar-color-dot--blue"></span>Niebieski</button>
    <button type="button" data-color-filter="green" aria-pressed="true"><span class="calendar-color-dot calendar-color-dot--green"></span>Zielony</button>
    <button type="button" data-color-filter="amber" aria-pressed="true"><span class="calendar-color-dot calendar-color-dot--amber"></span>Bursztynowy</button>
    <button type="button" data-color-filter="slate" aria-pressed="true"><span class="calendar-color-dot calendar-color-dot--slate"></span>Szary</button>
</div>
