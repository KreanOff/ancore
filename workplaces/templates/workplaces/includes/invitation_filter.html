<div class="documents-item-actions documents-view-selector" data-row-actions>
    <button type="button" id="workspace-invitation-direction" class="tasks-filter-button tasks-project-query-trigger" data-row-actions-toggle popovertarget="workspace-invitation-direction-menu" aria-controls="workspace-invitation-direction-menu" aria-haspopup="menu" aria-expanded="false" aria-label="Rodzaj zaproszeń" title="Rodzaj zaproszeń">
        <i data-icon="mail" aria-hidden="true"></i><span>{% if management_view == 'received' %}Otrzymane ({{ pending_invitations|length }}){% else %}Wysłane{% endif %}</span><i data-icon="chevron-down" class="tasks-project-query-trigger__chevron" aria-hidden="true"></i>
    </button>
    <nav id="workspace-invitation-direction-menu" class="tasks-section-menu documents-item-menu" popover="auto" role="menu" aria-label="Rodzaj zaproszeń" data-row-actions-panel>
        <div class="documents-menu-actions" role="none">
            <a class="tasks-project-menu-button" role="menuitem" href="{% url 'workplaces:workplaces' %}?view=received{% if team_workplace %}&amp;workspace={{ team_workplace.pk }}{% endif %}"{% if management_view == 'received' %} aria-current="page"{% endif %}><i data-icon="mail" aria-hidden="true"></i><span>Otrzymane ({{ pending_invitations|length }})</span></a>
            {% if invitation_workplace %}<a class="tasks-project-menu-button" role="menuitem" href="{% url 'workplaces:workplaces' %}?view=invitations&amp;workspace={{ invitation_workplace.pk }}"{% if management_view == 'invitations' %} aria-current="page"{% endif %}><i data-icon="mail" aria-hidden="true"></i><span>Wysłane</span></a>{% endif %}
        </div>
    </nav>
</div>
