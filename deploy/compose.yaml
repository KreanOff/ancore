name: ${ANCORE_PROJECT:-ancore-prod}

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

services:
  web:
    image: ${ANCORE_PROJECT:-ancore-prod}-web:${ANCORE_RELEASE:-local}
    build: {context: .., dockerfile: deploy/Dockerfile, target: web}
    restart: unless-stopped
    ports:
      - '${ANCORE_BIND:-0.0.0.0}:${ANCORE_HTTP_PORT:-8080}:80'
    environment:
      ANCORE_TLS_MODE: ${ANCORE_TLS_MODE:-http}
      ANCORE_PUBLIC_URL: ${ANCORE_PUBLIC_URL:-}
      ANCORE_HOST: ${ANCORE_HOST:-_}
      ANCORE_AUTHORITY: ${ANCORE_AUTHORITY:-localhost}
      ANCORE_SCHEME: ${ANCORE_SCHEME:-http}
    volumes:
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      backend: {condition: service_healthy}
      onlyoffice: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/health/ready/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  backend:
    image: ${ANCORE_PROJECT:-ancore-prod}-backend:${ANCORE_RELEASE:-local}
    build: {context: .., dockerfile: deploy/Dockerfile, target: backend}
    restart: unless-stopped
    init: true
    stop_grace_period: 150s
    environment:
      DEBUG: 'false'
      SECRET_KEY: ${SECRET_KEY:?Wygeneruj sekret Django}
      ALLOWED_HOSTS: ${ANCORE_ALLOWED_HOSTS:-${ANCORE_HOST:-*},localhost}
      ALLOW_IP_HOSTS: ${ANCORE_ALLOW_IP_HOSTS:-false}
      CSRF_TRUSTED_ORIGINS: ${ANCORE_PUBLIC_URL:-}
      TRUST_PROXY_HEADERS: 'true'
      SECURE_SSL_REDIRECT: ${ANCORE_HTTPS:-false}
      SESSION_COOKIE_SECURE: ${ANCORE_HTTPS:-false}
      CSRF_COOKIE_SECURE: ${ANCORE_HTTPS:-false}
      SECURE_HSTS_SECONDS: ${ANCORE_HSTS_SECONDS:-0}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ancore
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-true}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-false}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-Ancore <noreply@localhost>}
      DB_USER: ancore
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Wygeneruj hasło bazy}
      MEDIA_ROOT: /data/media
      PRIVATE_DOCUMENT_ROOT: /data/private
      STATIC_ROOT: /app/staticfiles
      BACKUP_CONTROL_ROOT: /data/control
      FILE_UPLOAD_TEMP_DIR: /data/tmp
      ONLYOFFICE_URL: /onlyoffice
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_ANCORE_URL: http://web:8081
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Wygeneruj sekret ONLYOFFICE}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
    volumes:
      - private:/data/private
      - media:/data/media
      - control:/data/control
      - temporary:/data/tmp
      - static:/app/staticfiles
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import os,urllib.request; r=urllib.request.Request("http://127.0.0.1:8000/health/ready/",headers={"Host": "localhost", "X-Forwarded-Proto": "https"}); urllib.request.urlopen(r,timeout=5).read()']
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *logging

  postgres:
    image: ${ANCORE_PROJECT:-ancore-prod}-postgres:${ANCORE_RELEASE:-local}
    build: {context: .., dockerfile: deploy/Dockerfile, target: database}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ancore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Wygeneruj hasło administratora bazy}
      ANCORE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Wygeneruj hasło aplikacji}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d ancore']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  backup:
    image: ${ANCORE_PROJECT:-ancore-prod}-backup:${ANCORE_RELEASE:-local}
    build: {context: .., dockerfile: deploy/Dockerfile, target: backup}
    restart: unless-stopped
    init: true
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: ancore
      PGUSER: ancore
      PGPASSWORD: ${POSTGRES_PASSWORD:?Wygeneruj hasło bazy}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
      BACKUP_TLS_MODE: ${ANCORE_TLS_MODE:-http}
      ANCORE_RELEASE: ${ANCORE_RELEASE:-local}
    volumes:
      - private:/source/private:ro
      - media:/source/media:ro
      - control:/control
      - ${ANCORE_ENV_FILE:-./.env}:/source/production.env:ro
      - ${ANCORE_BACKUP_DIR:?Wskaż katalog backupów}:/backups
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, python3, /opt/ancore/backup.py, health]
      start_period: 30s
      interval: 60s
      timeout: 5s
      retries: 3
    logging: *logging

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:10.0.0.1}
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Wygeneruj sekret ONLYOFFICE}
      JWT_HEADER: Authorization
      JWT_IN_BODY: 'true'
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      ALLOW_META_IP_ADDRESS: 'false'
      EXAMPLE_ENABLED: 'false'
      WELCOME_PAGE_ENABLED: 'false'
    shm_size: 256mb
    stop_grace_period: 120s
    volumes:
      - office_data:/var/www/onlyoffice/Data
      - office_cache:/var/lib/onlyoffice
      - office_database:/var/lib/postgresql
      - office_rabbitmq:/var/lib/rabbitmq
      - office_redis:/var/lib/redis
      - office_logs:/var/log/onlyoffice
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost/healthcheck | grep -qx true']
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *logging

volumes:
  postgres:
  private:
  media:
  temporary:
  control:
  static:
  office_data:
  office_cache:
  office_database:
  office_rabbitmq:
  office_redis:
  office_logs:
