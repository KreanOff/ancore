name: ${ANCORE_PROJECT:-ancore-prod}

x-logging: &logging
  driver: json-file
  options: {max-size: 10m, max-file: '3'}

services:
  web:
    image: ${ANCORE_PROJECT:-ancore-prod}-web:${ANCORE_RELEASE:-local}
    build: {context: .., dockerfile: deploy/Dockerfile, target: web}
    restart: unless-stopped
    ports:
      - '0.0.0.0:${ANCORE_HTTP_PORT:?Podaj port HTTP}:80'
    volumes:
      - static:/srv/static:ro
      - media:/srv/media:ro
    depends_on:
      backend: {condition: service_healthy}
      onlyoffice: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/health/ready/']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  backend:
    image: ${ANCORE_PROJECT:-ancore-prod}-backend:${ANCORE_RELEASE:-local}
    build: {context: .., dockerfile: deploy/Dockerfile, target: backend}
    restart: unless-stopped
    init: true
    stop_grace_period: 150s
    environment:
      DEBUG: 'false'
      SECRET_KEY: ${SECRET_KEY:?Wygeneruj sekret Django}
      ALLOWED_HOSTS: ${ANCORE_HOST:?Podaj adres IP serwera},localhost
      ALLOW_IP_HOSTS: 'false'
      CSRF_TRUSTED_ORIGINS: ${ANCORE_PUBLIC_URL:?Podaj adres HTTP aplikacji}
      TRUST_PROXY_HEADERS: 'true'
      SECURE_SSL_REDIRECT: 'false'
      SESSION_COOKIE_SECURE: 'false'
      CSRF_COOKIE_SECURE: 'false'
      SECURE_HSTS_SECONDS: '0'
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_NAME: ancore
      DB_USER: ancore
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Wygeneruj hasło bazy}
      MEDIA_ROOT: /data/media
      PRIVATE_DOCUMENT_ROOT: /data/private
      STATIC_ROOT: /app/staticfiles
      FILE_UPLOAD_TEMP_DIR: /data/tmp
      ONLYOFFICE_URL: /onlyoffice
      ONLYOFFICE_INTERNAL_URL: http://onlyoffice
      ONLYOFFICE_ANCORE_URL: http://web:8081
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Wygeneruj sekret ONLYOFFICE}
      WEB_WORKERS: ${WEB_WORKERS:-2}
      WEB_THREADS: ${WEB_THREADS:-4}
    volumes:
      - private:/data/private
      - media:/data/media
      - temporary:/data/tmp
      - static:/app/staticfiles
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; r=urllib.request.Request("http://127.0.0.1:8000/health/ready/",headers={"Host": "localhost"}); urllib.request.urlopen(r,timeout=5).read()']
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 5
    logging: *logging

  postgres:
    image: ${ANCORE_PROJECT:-ancore-prod}-postgres:${ANCORE_RELEASE:-local}
    build: {context: .., dockerfile: deploy/Dockerfile, target: database}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ancore
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Wygeneruj hasło administratora bazy}
      ANCORE_DB_PASSWORD: ${POSTGRES_PASSWORD:?Wygeneruj hasło aplikacji}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d ancore']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging

  onlyoffice:
    image: ${ONLYOFFICE_IMAGE:-onlyoffice/documentserver:10.0.0.1}
    restart: unless-stopped
    environment:
      JWT_ENABLED: 'true'
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?Wygeneruj sekret ONLYOFFICE}
      JWT_HEADER: Authorization
      JWT_IN_BODY: 'true'
      ALLOW_PRIVATE_IP_ADDRESS: 'true'
      ALLOW_META_IP_ADDRESS: 'false'
      EXAMPLE_ENABLED: 'false'
      WELCOME_PAGE_ENABLED: 'false'
    shm_size: 256mb
    stop_grace_period: 120s
    volumes:
      - office_data:/var/www/onlyoffice/Data
      - office_cache:/var/lib/onlyoffice
      - office_database:/var/lib/postgresql
      - office_rabbitmq:/var/lib/rabbitmq
      - office_redis:/var/lib/redis
      - office_logs:/var/log/onlyoffice
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent http://localhost/healthcheck | grep -qx true']
      start_period: 180s
      interval: 30s
      timeout: 10s
      retries: 10
    logging: *logging

volumes:
  postgres:
  private:
  media:
  temporary:
  static:
  office_data:
  office_cache:
  office_database:
  office_rabbitmq:
  office_redis:
  office_logs:
