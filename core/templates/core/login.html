{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ancore | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f1f5f9;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .login-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }
        .login-header .logo {
            color: #0f172a;
            font-size: 2rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .login-header .logo span {
            color: #be123c;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid #cbd5e1;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
        }
        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background-color: #0f172a;
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }
        .btn-login:hover {
            background-color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <div class="logo">ANCORE<span>.</span></div>
            <p style="color: #64748b; font-size: 0.875rem; margin-top: 0.5rem;">Please sign in to your account</p>
        </div>

        <form method="post">
            {% csrf_token %}
            
            {% if form.errors %}
                <div style="margin-bottom: 1rem; padding: 0.75rem; background-color: #fee2e2; color: #991b1b; font-size: 0.875rem;">
                    Invalid email or password.
                </div>
            {% endif %}

            {% if messages %}
                {% for message in messages %}
                    <div style="margin-bottom: 1rem; padding: 0.75rem; background-color: #dcfce7; color: #166534; font-size: 0.875rem;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" name="username" id="email" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required>
            </div>
            <button type="submit" class="btn-login">SIGN IN</button>
        </form>

        <div class="footer-link" style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: #64748b;">
            Don't have an account? <a href="{% url 'register' %}" style="color: #2563eb; text-decoration: none; font-weight: 600;">Sign Up</a>
        </div>
    </div>
</body>
</html>
