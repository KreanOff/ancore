<aside class="tasks-tracker-rail profile-rail" aria-label="Nawigacja ustawień">
    <div class="tasks-rail-header">
        <h1>Ustawienia</h1>
    </div>

    <nav class="tasks-rail-nav">
        <div class="tasks-rail-nav-group">
            <a href="{% url 'profile' %}" class="tasks-rail-link {% if request.resolver_match.view_name == 'profile' %}is-active{% endif %}">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-user-square">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                        <path d="M9 10a3 3 0 1 0 6 0a3 3 0 0 0 -6 0"/>
                        <path d="M6 21v-1a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v1"/>
                        <path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14"/>
                    </svg>
                </span>
                Profil użytkownika
            </a>
        </div>

        <div class="tasks-rail-nav-group">
            <a href="{% url 'settings' %}#security" class="tasks-rail-link">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 3l8 4v5c0 5-3.4 8-8 9c-4.6-1-8-4-8-9V7l8-4z"/><path d="M9.5 12l1.7 1.7L15 10"/></svg>
                </span>
                Bezpieczeństwo
            </a>
            <a href="{% url 'settings' %}#notifications" class="tasks-rail-link">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3H4a4 4 0 0 0 2-3v-3a7 7 0 0 1 4-6"/><path d="M9 17v1a3 3 0 0 0 6 0v-1"/></svg>
                </span>
                Powiadomienia
            </a>
            <a href="{% url 'settings' %}#appearance" class="tasks-rail-link">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h1.5a2 2 0 0 0 0-4H13a2 2 0 0 1 0-4h1a7 7 0 0 0-2-10z"/><path d="M7.5 10.5h.01"/><path d="M9.5 7.5h.01"/><path d="M14.5 7.5h.01"/></svg>
                </span>
                Wygląd
            </a>
            <a href="{% url 'settings' %}#region" class="tasks-rail-link">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a13 13 0 0 1 0 18"/><path d="M12 3a13 13 0 0 0 0 18"/></svg>
                </span>
                Język i region
            </a>
        </div>

        <div class="tasks-rail-nav-group">
            <a href="{% url 'settings' %}#data" class="tasks-rail-link">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M4 7c0 1.7 3.6 3 8 3s8-1.3 8-3s-3.6-3-8-3s-8 1.3-8 3z"/><path d="M4 7v5c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><path d="M4 12v5c0 1.7 3.6 3 8 3s8-1.3 8-3v-5"/></svg>
                </span>
                Dane i eksport
            </a>
            <a href="{% url 'settings' %}#integrations" class="tasks-rail-link">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1 0l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1 0l-2 2a5 5 0 0 0 7.1 7.1l1.1-1.1"/></svg>
                </span>
                Integracje
            </a>
            <a href="/admin/" class="tasks-rail-link">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8a3.5 3.5 0 0 0 0 7.5z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6l-.08.08a2 2 0 1 1-3.84 0L10 20a1.7 1.7 0 0 0-1-.6 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1l-.08-.08a2 2 0 1 1 0-3.84L4 10a1.7 1.7 0 0 0 .6-1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6l.08-.08a2 2 0 1 1 3.84 0L14 4a1.7 1.7 0 0 0 1 .6 1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.1.35.3.69.6 1l.08.08a2 2 0 1 1 0 3.84L20 14c-.3.31-.5.65-.6 1z"/></svg>
                </span>
                Admin
            </a>
            <a href="{% url 'settings' %}#help" class="tasks-rail-link">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.7 2.7 0 0 1 5.1 1.2c0 1.8-2.6 2-2.6 3.8"/><path d="M12 17h.01"/></svg>
                </span>
                Pomoc
            </a>
        </div>

    </nav>

    <div class="profile-rail-actions" aria-label="Akcje konta">
        <a href="{% url 'add_account' %}" class="tasks-rail-link profile-rail-action {% if request.resolver_match.view_name == 'add_account' %}is-active{% endif %}">
            <span class="tasks-rail-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M16 21a5 5 0 0 0-10 0"/><circle cx="11" cy="8" r="4"/><path d="M19 8v6"/><path d="M16 11h6"/></svg>
            </span>
            Dodaj konto
        </a>
        <form method="post" action="{% url 'logout' %}" class="profile-rail-action-form">
            {% csrf_token %}
            <button type="submit" class="tasks-rail-link profile-rail-action profile-rail-action--logout">
                <span class="tasks-rail-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M10 17l-5-5l5-5"/><path d="M5 12h12"/><path d="M14 5h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3"/></svg>
                </span>
                Wyloguj się
            </button>
        </form>
    </div>

</aside>
