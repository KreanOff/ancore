<span class="tasks-priority-icon" aria-hidden="true">
    {% if priority == 'urgent' %}
    <i data-lucide="circle-alert" data-lucide-fallback="triangle-alert" aria-hidden="true"></i>
    {% elif priority == 'high' %}
    <i data-lucide="arrow-up" data-lucide-fallback="chevron-up" aria-hidden="true"></i>
    {% elif priority == 'medium' %}
    <i data-lucide="equal" data-lucide-fallback="minus" aria-hidden="true"></i>
    {% elif priority == 'low' %}
    <i data-lucide="arrow-down" data-lucide-fallback="chevron-down" aria-hidden="true"></i>
    {% else %}
    <i data-lucide="circle" aria-hidden="true"></i>
    {% endif %}
</span>
